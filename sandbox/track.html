<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Track Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; font: 12px/1.3 system-ui, sans-serif; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #panel { position: fixed; right: 8px; top: 8px; width: 240px; max-height: calc(100% - 16px); overflow-y: auto; background: rgba(12, 16, 28, .8);
      color: #e8f1ff; border-radius: 8px; padding: 8px; box-sizing: border-box; }
    #panel h3 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fc4ff; }
    #panel button { margin: 2px; padding: 3px 6px; font-size: 11px; border: 0; border-radius: 4px; background: #2c3a58; color: #fff; cursor: pointer; }
    #panel button.on { background: #e8833a; }
    #panel input[type=range] { width: 100%; }
    #status { white-space: pre; font: 11px ui-monospace, Consolas, monospace; color: #cfe; }
    #map { position: fixed; left: 8px; bottom: 8px; width: 340px; height: 340px; background: rgba(12, 16, 28, .7); border-radius: 8px; }
    #map.big { width: min(92vw, 92vh); height: min(92vw, 92vh); left: 50%; top: 50%; transform: translate(-50%, -50%); bottom: auto; }
    @media (max-width: 600px) { #panel { top: auto; bottom: 8px; height: 40%; width: auto; left: 8px; } #map { width: 160px; height: 160px; top: 8px; bottom: auto; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="map" width="900" height="900"></canvas>
  <div id="panel"><div id="status"></div></div>
  <script type="module" src="./track.ts"></script>
</body>
</html>
