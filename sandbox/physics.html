<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Physik-Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; font: 13px/1.35 system-ui, sans-serif; color: #fff; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 12px; top: 12px; background: rgba(10, 14, 24, .72); padding: 10px 12px; border-radius: 10px; font-family: ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; min-width: 260px; }
    #speed { position: fixed; right: 18px; bottom: 14px; font: 800 44px/1 system-ui, sans-serif; text-shadow: 0 2px 8px #0008; }
    #speed small { font-size: 16px; opacity: .8; }
    #tier { position: fixed; right: 18px; bottom: 66px; display: flex; gap: 6px; }
    #tier i { width: 26px; height: 10px; border-radius: 5px; background: #fff3; }
    #panel { position: fixed; right: 12px; top: 12px; background: rgba(10, 14, 24, .72); padding: 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; max-width: 220px; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 4px; }
    #panel button { background: #2b3550; color: #fff; border: 0; border-radius: 6px; padding: 4px 7px; cursor: pointer; font-size: 12px; }
    #panel button.on { background: #4f7ae8; }
    #panel b { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
    #help { position: fixed; left: 12px; bottom: 12px; opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="tier"><i></i><i></i><i></i></div>
  <div id="speed"></div>
  <div id="panel"></div>
  <div id="help">W/A/S/D drive · Space/Shift drift · Q look back · R respawn · 1-5 hit (spin tumble squash zap bump) · B boost · C countdown restart · F debug colliders</div>
  <script type="module" src="./physics.ts"></script>
</body>
</html>
